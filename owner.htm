<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owner Dashboard | St. Williams Catholic Church</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">✦</div>
        <div>
          <p class="brand-name">St. Williams</p>
          <small>Catholic Church</small>
        </div>
      </div>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="index.html#readings">Readings</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
        <a href="owner.html">Owner</a>
      </nav>

      <a class="owner-button" href="index.html">Back to Home</a>
    </header>

    <main class="page-shell">
      <form id="ownerPasswordForm" class="auth-form owner-panel">
        <p class="eyebrow">Secure Access</p>
        <h3>Owner Dashboard Password</h3>
        <label>
          Password
          <input type="password" id="ownerPassword" placeholder="Enter owner password" required />
        </label>
        <button type="submit" class="btn btn-primary">Unlock Dashboard</button>
        <p id="ownerStatus" class="status-message" aria-live="polite"></p>
      </form>

      <section id="ownerDashboard" class="owner-wrapper hidden">
        <div class="owner-panel">
          <div class="owner-header">
            <h2>Dashboard</h2>
          </div>

          <form id="memberForm" class="owner-form">
            <div class="member-form-grid">
              <label>
                Full Name
                <input type="text" id="memberName" placeholder="Enter name" required />
              </label>

              <label>
                Email
                <input type="email" id="memberEmail" placeholder="member@example.com" required />
              </label>

              <label>
                Password
                <input type="text" id="memberPassword" placeholder="Create password" required />
              </label>

              <div class="input-row">
                <label>
                  Role
                  <select id="memberRole">
                    <option value="member">Member</option>
                    <option value="lector">Lector</option>
                    <option value="usher">Usher</option>
                    <option value="choir">Choir</option>
                  </select>
                </label>

                <label class="checkbox-wrap">
                  <input type="checkbox" id="memberStatus" />
                  <span>Approved</span>
                </label>
              </div>
            </div>

            <div class="owner-actions">
              <button type="submit" class="btn btn-primary">Add Member</button>
              <button type="button" class="btn btn-secondary" id="clearMemberForm">Clear</button>
            </div>
          </form>
        </div>

        <div class="list-panel">
          <div class="owner-header">
            <h2>Pending Signups</h2>
          </div>
          <div id="pendingTable" class="member-list"></div>
        </div>

        <div class="list-panel">
          <div class="owner-header">
            <h2>Members</h2>
          </div>
          <div id="memberTable" class="member-list"></div>
        </div>

        <div class="list-panel">
          <div class="owner-header">
            <h2>Service Schedule</h2>
          </div>

          <form id="ownerScheduleForm" class="owner-form">
            <label>
              Reader Name
              <input type="text" id="ownerScheduleName" placeholder="Enter name" required />
            </label>

            <label>
              Role
              <select id="ownerScheduleRole">
                <option value="Reader">Reader</option>
                <option value="Lector">Lector</option>
                <option value="Commentator">Commentator</option>
                <option value="Leader">Leader</option>
              </select>
            </label>

            <div class="input-row">
              <label>
                Day
                <select id="ownerScheduleDay">
                  <option value="Monday">Monday</option>
                  <option value="Tuesday">Tuesday</option>
                  <option value="Wednesday">Wednesday</option>
                  <option value="Thursday">Thursday</option>
                  <option value="Friday">Friday</option>
                  <option value="Saturday">Saturday</option>
                  <option value="Sunday">Sunday</option>
                </select>
              </label>

              <label>
                Time
                <input type="time" id="ownerScheduleTime" required />
              </label>
            </div>

            <div class="input-row">
              <label>
                Date
                <input type="number" id="ownerScheduleDate" min="1" max="31" required />
              </label>

              <label>
                Month
                <select id="ownerScheduleMonth">
                  <option value="January">January</option>
                  <option value="February">February</option>
                  <option value="March">March</option>
                  <option value="April">April</option>
                  <option value="May">May</option>
                  <option value="June">June</option>
                  <option value="July">July</option>
                  <option value="August">August</option>
                  <option value="September">September</option>
                  <option value="October">October</option>
                  <option value="November">November</option>
                  <option value="December">December</option>
                </select>
              </label>
            </div>

            <div class="owner-actions">
              <button type="submit" class="btn btn-primary">Add Schedule</button>
              <button type="button" class="btn btn-secondary" id="clearOwnerScheduleForm">Clear</button>
            </div>
          </form>

          <p id="ownerScheduleStatus" class="status-message" aria-live="polite"></p>
          <div id="ownerScheduleTable" class="member-list"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 St. Williams Catholic Church</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
