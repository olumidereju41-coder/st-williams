<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | St. Williams Catholic Church</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">✦</div>
        <div>
          <p class="brand-name">St. Williams</p>
          <small>Catholic Church</small>
        </div>
      </div>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="index.html#readings">Readings</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
        <a href="owner.html">Owner</a>
      </nav>

      <a class="owner-button" href="owner.html">Owner Area</a>
    </header>

    <main class="signup-page">
      <section class="auth-card">
        <p class="eyebrow">New Member</p>
        <h2>Sign Up</h2>
        <form id="signupForm" class="auth-form">
          <label>
            Full Name
            <input type="text" id="signupName" placeholder="Full name" required />
          </label>
          <label>
            Email
            <input type="email" id="signupEmail" placeholder="email@example.com" required />
          </label>
          <label>
            Password
            <input type="password" id="signupPassword" placeholder="Create password" required />
          </label>
          <button type="submit" class="btn btn-primary">Request Access</button>
        </form>
        <p id="signupMessage" class="message" aria-live="polite"></p>
        <p>Already have an account? <a href="login.html">Login here</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 St. Williams Catholic Church</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
